      <section class="panel"><h2>На что обратить внимание</h2><p>Слова в минуту = количество слов × 60 / время в секундах. Измерение зависит от того, когда ребёнок нажал кнопки. На некоторых устройствах продолжительный сон компьютера может влиять на работу браузерного таймера. Федеральные возрастные ориентиры к концу года не используются здесь как проверка «сдал / не сдал».</p><p class="microcopy">Перед массовым использованием авторский банк рекомендуется дополнительно проверить с педагогом начальных классов.</p></section>`;

  function go(view) {
    if (state.view === 'reader' && state.running && view !== 'quiz') {
      if (!window.confirm('Чтение ещё идёт. Если выйти, эта попытка не сохранится. Выйти?')) return;
    }
    state.view = view;
    state.running = false; state.startedAt = null; state.flash = '';

  }
  function chooseStory(id) {
    if (!DATA.some(t=>t.id === id)) return;
    state.textId = id; state.running=false; state.startedAt=null; state.elapsedSeconds=null;
    state.answers=[null,null,null]; state.flash='';state.revealReview=false;state.justFinished=null;
    state.view='reader';render();
  }
  function randomUnseen() {
    const inGrade = DATA.filter(t=>t.grade===state.grade);
    const completed = completedIds(state.grade);
    const unseen = inGrade.filter(t=>!completed.has(t.id));
    const choices = unseen.length ? unseen : inGrade;
    if (choices.length) chooseStory(choices[Math.floor(Math.random()*choices.length)].id);
  }
  function submitQuiz() {
    if (state.answers.some(a=>a === null)) return;
    const t=activeStory(); if(!t || !Number.isFinite(state.elapsedSeconds) || state.elapsedSeconds<=0) return;
    const prior = records().some(a => a.text_id===t.id);
    const attempt = {
      attempt_id: typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `attempt-${Date.now()}-${Math.random().toString(36).slice(2)}`,
      text_id:t.id, grade:t.grade, elapsed_seconds:Math.round(state.elapsedSeconds*1000)/1000,
      wpm_approx:wpmFor(t,state.elapsedSeconds),correct_answers:t.questions.reduce((n,q,i)=>n+(q.correct_index===state.answers[i]?1:0),0),
      total_questions:3, completed_at:new Date().toISOString(), repeated_text:prior, answers:[...state.answers]
    };
    state.sessionHistory.push(attempt);
    if(state.saveEnabled) {
      state.attempts.push(attempt); if (state.attempts.length>300) state.attempts=state.attempts.slice(-300);
      safeSave(HISTORY_KEY,state.attempts);
    }
    state.justFinished=attempt; state.revealReview=false;state.view='result';render();
  }
  function clearHistory() {
    if (!window.confirm('Удалить всю сохранённую историю чтения на этом устройстве? Отменить это действие не получится.')) return;
    state.attempts=[]; state.sessionHistory=[]; state.justFinished=null;
    try { localStorage.removeItem(HISTORY_KEY); } catch { state.storageProblem=true; }
    render(false);announce('История удалена.');
  }
  document.addEventListener('click',(e) => {
    const btn = e.target.closest('[data-action]'); if (!btn || !btn.matches('button')) return;
    const action=btn.dataset.action;
    switch(action) {
      case 'home': go('home');break;
      case 'parents':go('parents');break;
      case 'progress':state.progressGrade=state.grade;go('progress');break;
      case 'choose-grade':state.grade=Number(btn.dataset.grade);go('stories');break;
      case 'back-to-stories': go('stories');break;
      case 'pick-story': chooseStory(btn.dataset.id);break;
      case 'random-story':randomUnseen();break;
      case 'start':
        if(state.view!=='reader'||state.running) break;
        state.startedAt=performance.now();state.running=true;state.flash='';render();announce('Чтение началось. Таймер скрыт.');break;
      case 'finish':
        if(state.view!=='reader'||!state.running) break;
        {
          const seconds=(performance.now()-state.startedAt)/1000;
          if(seconds<5) {state.flash='Похоже, кнопка нажата слишком рано. Продолжай читать и нажми её, когда закончишь.';render(false);break;}
          state.elapsedSeconds=seconds;state.running=false;state.startedAt=null;state.flash='';state.view='quiz';render();
        }break;
      case 'font-minus':state.fontSize=Math.max(20,state.fontSize-2);saveOptions();render(false);break;
      case 'font-plus':state.fontSize=Math.min(32,state.fontSize+2);saveOptions();render(false);break;
      case 'select-answer':
        if(state.view!=='quiz') break;
        {const q=Number(btn.dataset.q),a=Number(btn.dataset.a);if(q<0||q>2||a<0||a>2)break;
        state.answers[q]=a;
        document.querySelectorAll(`[data-action="select-answer"][data-q="${q}"]`).forEach(b=>{const chosen=Number(b.dataset.a)===a;b.classList.toggle('is-selected',chosen);b.setAttribute('aria-pressed',String(chosen));});
        const count=state.answers.filter(v=>v!==null).length;document.getElementById('submit-quiz').disabled=count!==3;
        document.getElementById('quiz-counter').textContent=`Отвечено: ${count} из 3`;}
        break;
      case 'submit-quiz':submitQuiz();break;
      case 'toggle-review':state.revealReview=!state.revealReview;render(false);break;
      case 'again':chooseStory(state.textId);break;
      case 'other-story':go('stories');break;
      case 'progress-grade':state.progressGrade=Number(btn.dataset.grade);render(false);break;
      case 'progress-start':state.grade=Number(btn.dataset.grade);go('stories');break;
      case 'clear-history':clearHistory();break;
      default:break;
    }
  });
  document.addEventListener('change',(e)=>{
    if(e.target.id!=='save-toggle')return;
    state.saveEnabled=Boolean(e.target.checked);
    if(state.saveEnabled) {
      const seen=new Set(state.attempts.map(a=>a.attempt_id));
      for (const a of state.sessionHistory) { if(!seen.has(a.attempt_id))state.attempts.push(a); }
      state.attempts=state.attempts.slice(-300);
      safeSave(HISTORY_KEY,state.attempts);
    }
    saveOptions();render(false);
  });
  // При перезагрузке активный таймер исчезнет, незаконченная попытка не записывается.
  if (DATA.length!==15 || [2,3,4].some(g=>DATA.filter(t=>t.grade===g).length!==5 || DATA.filter(t=>t.grade===g).some(t=>t.questions.length!==3))) {
    app.innerHTML='<div class="panel"><h1>Не удалось загрузить истории</h1><p>Проверьте, что рядом с index.html находится файл data.js.</p></div>';
  } else { render(); }
})();

</script>
</body>
</html>
